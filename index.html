  /* --------------------------------------------------------------------------
   *  Menu / configuration de partie
   * ------------------------------------------------------------------------ */
  /* --------------------------------------------------------------------------
   *  DIDACTICIEL — petit tutoriel illustré (auto au 1er lancement + menu).
   * ------------------------------------------------------------------------ */
  let tutoStep = 0;
  const COULF = { braise: '#ff5a3c', onde: '#2ea6ff', eclair: '#ffcf33', seve: '#35d07f' };
  function miniCarte(bg, label, txtCoul) {
    return '<span style="display:inline-flex;align-items:center;justify-content:center;width:42px;height:58px;' +
      'border-radius:8px;background:' + bg + ';color:' + (txtCoul || '#fff') + ';font-weight:900;font-size:20px;' +
      'border:2px solid rgba(255,255,255,.85);box-shadow:0 3px 8px rgba(0,0,0,.4)">' + label + '</span>';
  }
  function etapesTuto() {
    const fleche = '<span style="font-size:22px;color:#8b95b5">→</span>';
    return [
      { emoji: '🌱', titre: t('tut1_t'), texte: t('tut1_x') },
      { emoji: '🎨', titre: t('tut2_t'), visuel: miniCarte(COULF.onde, '7') + fleche + miniCarte(COULF.onde, '3') + miniCarte(COULF.braise, '7'), texte: t('tut2_x') },
      { emoji: '✦', titre: t('tut3_t'), visuel: miniCarte('linear-gradient(135deg,#b3a9ff,#7a6bff)', '✦'), texte: t('tut3_x') },
      { emoji: '⚡', titre: t('tut4_t'), visuel: miniCarte(COULF.braise, '+2') + miniCarte(COULF.eclair, '⊘', '#3a2c00') + miniCarte(COULF.seve, '↺'), texte: t('tut4_x') },
      { emoji: '🃏', titre: t('tut5_t'), texte: t('tut5_x') },
      { emoji: '🔔', titre: t('tut6_t'), texte: t('tut6_x') },
      { emoji: '🏆', titre: t('tut7_t'), texte: t('tut7_x') },
    ];
  }
  function tutoriel(auto) {
    const TUTO = etapesTuto();
    const total = TUTO.length;
    if (tutoStep < 0) tutoStep = 0;
    if (tutoStep >= total) tutoStep = total - 1;
    const s = TUTO[tutoStep];
    const o = overlay(); o.className = 'menuPlein'; o.style.display = 'flex';
    let html = '<div class="panneau tuto">';
    html += '<div style="font-size:46px;margin-bottom:4px">' + s.emoji + '</div>';
    html += '<h2>' + s.titre + '</h2>';
    if (s.visuel) html += '<div style="margin:12px 0;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap">' + s.visuel + '</div>';
    html += '<p>' + s.texte + '</p>';
    html += '<div style="margin:14px 0;letter-spacing:3px;color:#a07d2a">' + TUTO.map((_, i) => (i === tutoStep ? '●' : '○')).join('') + '</div>';
    html += '<div style="display:flex;gap:8px">';
    if (tutoStep > 0) html += '<button class="sec" id="tPrec" style="flex:1;margin-top:0">' + t('precedent') + '</button>';
    if (tutoStep < total - 1) html += '<button class="gros" id="tSuiv" style="flex:2;margin-top:0">' + t('suivant') + '</button>';
    else html += '<button class="gros" id="tFin" style="flex:2;margin-top:0">' + t('cest_parti') + '</button>';
    html += '</div>';
    if (tutoStep < total - 1) html += '<button class="lienOptions" id="tPasser" style="color:#8a7030">' + t('passer') + '</button>';
    html += '</div>';
    o.innerHTML = html;
    const finir = () => {
      if (profil) { profil.reglages.tutoVu = true; SparkoMeta.sauver(stockage, profil); }
      menu();
      if (auto) popupQuotidien();
    };
    const bp = document.getElementById('tPrec'); if (bp) bp.onclick = () => { Sons.clic(); tutoStep--; tutoriel(auto); };
    const bs = document.getElementById('tSuiv'); if (bs) bs.onclick = () => { Sons.clic(); tutoStep++; tutoriel(auto); };
    const bf = document.getElementById('tFin'); if (bf) bf.onclick = () => { Sons.victoire(); finir(); };
    const bx = document.getElementById('tPasser'); if (bx) bx.onclick = () => { Sons.clic(); finir(); };
  }

  function menu() {
    const o = overlay(); o.className = 'menuPlein'; o.style.display = 'flex';
    const skin = (cosmEquipes && cosmEquipes.sparko) || { e: { content: '😄' } };
    const nivLab = { 1: t('niv1'), 2: t('niv2'), 3: t('niv3'), 4: t('niv4') };
    const pill = (g, v, lab) => '<button class="pill' + (menuChoix[g] === v ? ' actif' : '') + '" data-g="' + g + '" data-v="' + v + '">' + lab + '</button>';

    let html = '<div class="panneau menu">';
    html += '<div class="titreJeu">' + (skin.e.content || '😄') + ' <span>ZELEM</span></div>';
    html += '<p class="tagline">' + t('tagline') + '</p>';
    html += '<button class="lienOptions" id="cfgTuto" style="margin:-6px 0 10px">' + t('comment_jouer') + '</button>';

    html += '<div class="choixLigne"><span>' + t('adversaires') + '</span><div class="pills">' + pill('adversaires', 1, '1') + pill('adversaires', 2, '2') + pill('adversaires', 3, '3') + '</div></div>';
    html += '<div class="choixLigne"><span>' + t('niveau') + '</span><div class="pills">' + [1, 2, 3, 4].map((n) => pill('niveau', n, nivLab[n])).join('') + '</div></div>';
    html += '<div class="choixLigne"><span>' + t('vitesse') + '</span><div class="pills">' + pill('vitesse', 'lente', '🐢') + pill('vitesse', 'normale', '🚶') + pill('vitesse', 'rapide', '⚡') + '</div></div>';
    const langPill = (l, lab) => '<button class="pill' + (langue === l ? ' actif' : '') + '" data-lang="' + l + '">' + lab + '</button>';
    html += '<div class="choixLigne"><span>' + t('langue') + '</span><div class="pills">' + langPill('fr', 'FR') + langPill('en', 'EN') + langPill('es', 'ES') + '</div></div>';

    html += '<button class="lienOptions" id="toggleOpt">' + t('options_regles') + ' ' + (menuOptions ? '▲' : '▼') + '</button>';
    if (menuOptions) {
      const opt = (g, lab) => '<button class="opt' + (menuChoix[g] ? ' actif' : '') + '" data-g="' + g + '" data-v="toggle">' + (menuChoix[g] ? '✅' : '⬜') + ' ' + lab + '</button>';
      html += '<div class="optbloc">' + opt('stack', t('opt_stack')) + opt('orig', t('opt_orig')) + opt('chaos', t('opt_chaos')) + opt('wild8', t('opt_wild8')) + opt('score', t('opt_score')) + '</div>';
    }

    html += '<button id="cfgJouer" class="jouer">' + t('jouer') + '</button>';
    html += '<div class="tuiles">' +
      '<button class="tuile t1" id="cfgQuotidien"><span class="ic">🎁</span>' + t('t_cadeau') + '</button>' +
      '<button class="tuile t2" id="cfgMissions"><span class="ic">🎯</span>' + t('t_missions') + '</button>' +
      '<button class="tuile t3" id="cfgBoutique"><span class="ic">🛍️</span>' + t('t_boutique') + '</button>' +
      '<button class="tuile t4" id="cfgStats"><span class="ic">📊</span>' + t('t_profil') + '</button>' +
      '</div>';
    html += '</div>';
    o.innerHTML = html;

    // Pastilles (adversaires/niveau/vitesse) + options : mettent à jour le choix.
    const pastilles = document.querySelectorAll ? document.querySelectorAll('.pill, .opt') : [];
    if (pastilles.forEach) pastilles.forEach((b) => {
      b.onclick = () => {
        initAudio(); Sons.clic();
        if (b.dataset.lang) { changerLangue(b.dataset.lang); menu(); return; }
        const g = b.dataset.g, v = b.dataset.v;
        menuChoix[g] = (v === 'toggle') ? !menuChoix[g] : (g === 'vitesse' ? v : parseInt(v, 10));
        menu();
      };
    });
    const tg = document.getElementById('toggleOpt'); if (tg) tg.onclick = () => { Sons.clic(); menuOptions = !menuOptions; menu(); };

    document.getElementById('cfgJouer').onclick = () => {
      const config = {
        numPlayers: menuChoix.adversaires + 1,
        seed: (Date.now() % 1000000) + 1,
        vitesse: menuChoix.vitesse,
        variantStacking: menuChoix.stack,
        variantOriginals: menuChoix.orig,
        variantChaos: menuChoix.chaos,
        variantWild8: menuChoix.wild8,
        scoreMode: menuChoix.score,
        scoreTarget: 300,
      };
      const niveaux = []; for (let i = 0; i < config.numPlayers; i++) niveaux.push(menuChoix.niveau);
      demarrer(config, niveaux);
    };
    const bM = document.getElementById('cfgMissions'); if (bM) bM.onclick = () => { Sons.clic(); panneauMissions(); };
    const bS = document.getElementById('cfgStats'); if (bS) bS.onclick = () => { Sons.clic(); panneauStats(); };
    const bB = document.getElementById('cfgBoutique'); if (bB) bB.onclick = () => { Sons.clic(); panneauBoutique(); };
    const bQ = document.getElementById('cfgQuotidien'); if (bQ) bQ.onclick = () => { Sons.clic(); popupQuotidien(); };
    const bT = document.getElementById('cfgTuto'); if (bT) bT.onclick = () => { Sons.clic(); tutoStep = 0; tutoriel(false); };
  }

  // Démarre (ou relance) une partie et lance la boucle.
  function demarrer(config, niveaux) {
    initAudio(); Sons.clic();
    const V = { lente: { avant: 950, apres: 520 }, normale: { avant: 550, apres: 300 }, rapide: { avant: 240, apres: 140 } };
    vitesse = V[config.vitesse] || V.normale;
    fermerOverlay();
    statsPartie = { jokers: 0, attaques: 0, sparko: false };
    dernieresRecompenses = null;
    jeu = SparkoGame.creer({ config, niveaux, humain: 0 });
    avatars = attribuerAvatars(config.seed || 1, config.numPlayers, 0);
    messageStatut = '';
    rendre();
    boucle();
  }

  /* --------------------------------------------------------------------------
   *  Initialisation (appelée par la page)
   * ------------------------------------------------------------------------ */
  function init() {
    canvas = document.getElementById('table');
    ctx = canvas.getContext('2d');

    // Sauvegarde : charge le profil, prépare les missions du jour.
    stockage = SparkoMeta.creerStockage();
    profil = SparkoMeta.charger(stockage);
    langue = profil.reglages.langue || detecterLangue();
    profil.reglages.langue = langue;
    SparkoMeta.genererMissions(profil);
    SparkoMeta.sauver(stockage, profil);
    majCosmetiques();
    muet = !!profil.reglages.muet;
    majHud();
    appliquerLangueDOM();

    // Boutons d'action (chaque interaction initialise aussi l'audio).
    document.getElementById('btnPioche').onclick = () => { initAudio(); if (jeu && SparkoGame.estTourHumain(jeu)) { agir({ type: 'draw' }); boucle(); } };
    document.getElementById('btnGarder').onclick = () => { initAudio(); if (jeu) { agir({ type: 'pass' }); boucle(); } };
    document.getElementById('btnSparko').onclick = () => { initAudio(); if (jeu) { statsPartie.sparko = true; agir({ type: 'announce', playerIndex: jeu.humain }); Sons.sparko(); rendre(); } };
    document.getElementById('btnMenu').onclick = () => { initAudio(); Sons.clic(); menu(); };

    // Bouton son (coupe/rétablit, mémorisé dans le profil)
    const btnSon = document.getElementById('btnSon');
    if (btnSon) {
      btnSon.textContent = muet ? '🔇' : '🔊';
      btnSon.onclick = () => {
        initAudio(); muet = !muet; btnSon.textContent = muet ? '🔇' : '🔊';
        if (profil) { profil.reglages.muet = muet; SparkoMeta.sauver(stockage, profil); }
        if (!muet) Sons.clic();
      };
    }

    // Toucher / clic sur la table
    const pos = (e) => {
      const rect = canvas.getBoundingClientRect();
      const p = e.touches ? e.touches[0] : e;
      return { x: p.clientX - rect.left, y: p.clientY - rect.top };
    };
    canvas.addEventListener('click', (e) => { initAudio(); const p = pos(e); surClic(p.x, p.y); });

    window.addEventListener('resize', redimensionner);
    redimensionner();
    menu(); // écran d'accueil
    if (profil && !profil.reglages.tutoVu) { tutoStep = 0; tutoriel(true); } // tutoriel au 1er lancement
    else popupQuotidien(); // sinon, récompense du jour si disponible

    // Boucle d'animation continue (si disponible).
    const raf = window.requestAnimationFrame ? window.requestAnimationFrame.bind(window) : null;
    if (raf) { const tick = () => { rendre(); raf(tick); }; raf(tick); }
  }

  root.SparkoUI = { init, _setLangue: changerLangue };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

})(typeof window !== 'undefined' ? window : globalThis);
</script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
